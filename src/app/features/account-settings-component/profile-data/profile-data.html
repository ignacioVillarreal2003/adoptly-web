<section class="profile-data">
  <h1>Profile Data</h1>
  <div class="profile-data__option">
    <h2>Individual Data</h2>
    <input type="text" id="username" name="username" placeholder="username" ngModel required />
    <input type="text" id="firstName" name="firstName" placeholder="first name" ngModel required />
    <input type="text" id="lastName" name="lastName" placeholder="last name" ngModel required />
    <input
      type="tel"
      id="phoneNumber"
      name="phoneNumber"
      placeholder="phone number"
      ngModel
      required
    />
    <div class="profile-data__more-option">
      <button>More</button>
      <textarea name="biography" id="biography" placeholder="Biography" ngModel required></textarea>

      <select name="genre" id="genre">
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>
      <input
        type="datetime"
        id="dateOfBirth"
        name="dateOfBirth"
        placeholder="date of birth"
        ngModel
        required
      />
      <textarea
        name="occupation"
        id="occupation"
        placeholder="occupation"
        ngModel
        required
      ></textarea>
      <select name="maritalStatus" id="maritalStatus">
        <option value="single">Single</option>
        <option value="married">Married</option>
        <option value="divorced">Divorced</option>
        <option value="widowed">Widowed</option>
      </select>
      <input
        type="number"
        min="0"
        max="10"
        id="childrenCount"
        name="childrenCount"
        placeholder="Number of children"
        ngModel
        required
      />
      <textarea
        name="otherPetsDescription"
        id="otherPetsDescription"
        placeholder="Other pets description"
        ngModel
        required
      ></textarea>

      <select name="livingSituation" id="livingSituation">
        <option value="house">House</option>
        <option value="apartment">Apartment</option>
      </select>
    </div>
  </div>






  
</section>
