<section class="password-settings">
  <h1>Password Settings</h1>
  <div class="password-settings__option">
    <h2>Change Your Password</h2>
    <form>
      <div class="form-group">
        <label for="currentPassword">Current Password</label>
        <input type="password" id="currentPassword" name="currentPassword" ngModel required />
      </div>
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" name="newPassword" ngModel required minlength="8" />
      </div>
    </form>
    <button type="submit">Change Password</button>
  </div>
</section>
